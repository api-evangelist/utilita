actions:
  apisListed: 1
  openapiHarvested: false
  openapiGenerated: true
  specsCount: 1
  openapiDirectoryCreated: true
  reason: |
    Round 1 correctly found no energy-data API and correctly refused the
    api.myutilita.co.uk false positive (a squatted third-party domain whose
    spec-shaped paths return HTML redirect interstitials). Round 2 found the one
    real surface it had missed: the public Statuspage v2 read API on
    status.utilita.co.uk. Utilita publishes no OpenAPI, so
    openapi/utilita-status-openapi.yml was GENERATED from live observation of all
    eight endpoints, with an x-evidence block (URL, HTTP status, probe date) on
    every operation and verbatim response snapshots in examples/. Nothing was
    invented: no request parameter, error code or field appears that was not
    observed on the wire.
  classification: enriched
