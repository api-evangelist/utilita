aid: utilita
name: Utilita
review:
  question: Does Utilita Energy publish any documented, machine-readable public API —
    and does any energy data mandate bind it to do so?
  answer: false
  date: '2026-07-27'
  reviewer: API Evangelist
  tier: utility-retailer
  homeMarket: United Kingdom
  primaryDomain: utilita.co.uk
findings:
  summary: |
    Utilita Energy publishes NO public API of any kind. There is no developer
    portal, no API reference, no OpenAPI/Swagger/AsyncAPI document, no GraphQL
    schema, no Postman collection, and no open data programme. Every developer
    host and path probed on 2026-07-27 either failed DNS resolution or returned
    404. Customer usage, balance and top-up data is reachable only through the
    My Utilita web portal and mobile app behind an account login.

    The market seam matters here. Britain mandated the smart-meter
    INFRASTRUCTURE, not a consumer data right. Utilita holds an Ofgem supply
    licence, is obliged by that licence to accede to the Smart Energy Code and
    become a DCC user, and communicates with meters through the Smart DCC — a
    licensed monopoly whose DCC User Interface is a private, contracted B2B
    interface, not a public API. There is no UK equivalent of the Australian
    Consumer Data Right for energy and no Ontario-style Green Button regulation,
    so nothing compels Utilita to expose customer usage to accredited third
    parties. Third parties who want GB smart-meter data go to the DCC as an
    "Other User" under the Data Access and Privacy Framework with explicit
    consumer consent — they do not go to Utilita.

    The contrast inside the same market is the finding: Octopus Energy, a UK
    peer, publishes a real self-serve developer API and licenses its Kraken
    platform to utilities worldwide, and NESO publishes a genuinely open Carbon
    Intensity API. Utilita, a comparably sized supplier, publishes neither
    consumer nor market data. The UK's API-native supplier is the exception, not
    the rule; Utilita is the rule.
mandate:
  regime: smart-meter-infrastructure
  regimeDetail: |
    GB Smart Metering: the Smart Energy Code (SEC), the Smart Meter Communication
    Licence held by the Smart DCC, and the SMETS1/SMETS2 device specifications.
    All licensed energy suppliers are required by their supply licence conditions
    to accede to the SEC and become a DCC User. This is an obligation to install
    and communicate with meters over mandated infrastructure. It is NOT a
    consumer data-portability right and it creates no obligation to publish an
    API.
  status: live-implemented
  statusJustification: |
    Recorded as live-implemented for the INFRASTRUCTURE mandate only, and the
    evidence is documentary rather than an endpoint — say so plainly.
    What was verified:
      - Utilita installed the first residential smart electricity meter in Great
        Britain in 2005 and the first combined smart gas + electricity system in
        2008 (company About page + Wikipedia).
      - UK Parliament written evidence on smart meters records Utilita's
        portfolio as ~99% prepayment customers, ~80% of whom use SMETS1 meters
        in prepayment mode — i.e. a real, operating smart-meter estate.
      - Ofgem hosts a Utilita Energy response to the DCC Operational Performance
        Regime consultation, which is regulator-published evidence that Utilita
        participates in DCC/SEC governance as a user.
    What was NOT verified:
      - No SEC party register entry was retrieved directly; the SECCo party-list
        URLs probed returned 404 (see probes below).
      - No DCC endpoint, base URI, or machine-readable artifact was obtained —
        the DCC User Interface is a private licensed interface and is not
        publicly documented.
  consumerDataRight:
    applies: false
    detail: |
      No consumer data-portability mandate binds Utilita. The UK has no CDR-energy
      equivalent, no Ontario-style Green Button regulation, and no Green Button
      voluntary adoption was found at Utilita. Consumer access to smart-meter data
      by third parties runs through the DCC "Other User" route under the Data
      Access and Privacy Framework with prior consumer consent, not through the
      supplier.
    regimeIfAsked: none
dataStandard:
  apiDataStandard: no standard reference found
  detail: |
    No Green Button / ESPI, no CDR Consumer Data Standards (energy), no OCPP/OCPI,
    no OpenADR, no IEEE 2030.5, no IEC CIM 61968/61970, and no proprietary published
    schema. The only standards in play are device/communications standards —
    SMETS1/SMETS2 metering under the Smart Energy Code — which are not API data
    standards and are not exposed to developers.
dataSplit:
  consumerDataAPI:
    available: false
    detail: |
      No documented API returns an individual customer's usage or billing data.
      The My Utilita web portal (https://my.utilita.co.uk/login) and the My Utilita
      iOS/Android apps are the only routes, and both require a Utilita customer
      account. No public API contract backs them.
  marketDataOpen:
    available: false
    detail: |
      Utilita publishes no open grid, market, settlement or system data. There is
      no /open-data or /data page (both 404) and no data licence or portal. GB
      open market data in this sector comes from other organizations entirely —
      NESO's Carbon Intensity API, Elexon's BSC/Balancing and Settlement data, and
      DNO open-data portals — none of which are Utilita surfaces.
  theSplit: |
    Closed on BOTH axes. This is not the "open market data / closed consumer data"
    split seen at system operators, nor the mandated-consumer-data shape seen in
    Australia. It is a plain retail supplier with no API programme at all.
access:
  gate: none-published
  gated: true
  howADeveloperGetsIn: |
    There is no route. No developer portal exists to sign up for, no application
    form, no partner programme page, no data licence, and no published contact for
    API access. A developer's only options are (a) log in to My Utilita as a
    customer and read the screen, or (b) go around Utilita entirely and pursue DCC
    "Other User" accession under the Smart Energy Code, which requires SEC party
    status, security assurance and consumer consent — a regulated onboarding to the
    DCC, not to Utilita.
  authModel: |
    Customer session authentication only. https://my.utilita.co.uk/login is a PHP 8
    (Laravel-style: XSRF-TOKEN + myutilita_session cookies) application on Azure App
    Service behind Imperva/Incapsula. No OAuth 2.0, no OpenID Connect, no API keys,
    no mTLS, and no client-credentials flow is published.
    https://utilita.co.uk/.well-known/openid-configuration returns 404 and
    https://my.utilita.co.uk/.well-known/openid-configuration returns 404, so no
    OIDC discovery document is served anonymously.
