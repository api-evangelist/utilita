sources:
- url: https://utilita.co.uk/about-us
  type: About
  note: Self-description — smart Pay As You Go supplier since 2003; first GB smart meter
    installer; My Utilita app; Utilita Home solar; Energy Hubs.
- url: https://en.wikipedia.org/wiki/Utilita_Energy
  type: Reference
  note: Founded 2003 by Bill Bullen, HQ Eastleigh; 800,000+ customers (Jan 2021, ~2.6%
    of the domestic market); first residential smart electricity meter 2005, first
    combined gas+electricity smart system 2008; My Utilita app launched 2018; parent
    Luxion Group (formerly Utilita Group) also owns Procode and Canary Care.
- url: https://committees.parliament.uk/writtenevidence/66782/html/
  type: Regulatory
  note: UK Parliament written evidence on smart meters — records Utilita's portfolio as
    ~99% prepayment customers, ~80% on SMETS1 meters in prepayment mode.
- url: https://www.ofgem.gov.uk/system/files/docs/2017/03/utilita_energy_-_dcc_opr_consultation_response.pdf
  type: Regulatory
  note: Ofgem-published Utilita Energy response to the DCC Operational Performance Regime
    consultation — regulator-published evidence of Utilita participating in DCC/SEC
    governance as a user.
- url: https://smartenergycodecompany.co.uk/becoming-a-dcc-user/
  type: Regulatory
  note: All energy suppliers holding an energy licence are required by licence condition
    to become a DCC User; only DCC Users may use DCC Services and the DCC User Interface.
- url: https://www.gov.uk/government/publications/smart-metering-implementation-programme-review-of-the-data-access-and-privacy-framework/smart-metering-implementation-programme-review-of-the-data-access-and-privacy-framework
  type: Regulatory
  note: The GB Data Access and Privacy Framework — third-party "Other Users" access
    consumption data via the DCC with prior consumer consent. Consent-based, not an
    open-banking-style portability mandate, and not routed through the supplier.
- url: https://www.smartdcc.co.uk/about-dcc/governance-regulations/smart-dcc-licence-regulation/
  type: Regulatory
  note: The Smart Meter Communication Licence and the DCC's role as the licensed GB
    smart-metering communications monopoly.
actions:
  apisListed: 0
  openapiHarvested: false
  specsCount: 0
  openapiDirectoryCreated: false
  reason: |
    Nothing real was found to save. The only artifacts that returned HTTP 200 at
    spec-shaped paths were on api.myutilita.co.uk, a squatted third-party domain
    unrelated to Utilita, and their bodies were HTML redirect interstitials rather
    than parseable JSON. Recording them would have been fabrication. The openapi/
    directory is deliberately omitted.
  classification: built-stub
