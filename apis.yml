apis:
- aid: utilita:utilita-status-api
  name: Utilita Status API
  description: >-
    Public, anonymous, read-only JSON API reporting the live operational state of Utilita Energy's
    services. Eight GET endpoints under https://status.utilita.co.uk/api/v2 return the page status
    indicator, all 21 tracked components (SMETS1, SMETS1 DCC-enrolled and SMETS2 smart meters, Guest
    Payments, Open Banking, PayPoint in-store and IVR top-up, PayZone in-store, the My Utilita app and
    web portal, Power-up functionality, utilita.co.uk, join.utilita.co.uk, telephone lines, the
    chatbot, smart meter installations and the smart metering network), open and historical incidents
    with their full update timelines, and scheduled maintenance windows. No API key, no sign-up, no
    OAuth — every endpoint is anonymous and CORS-open with a 10-second cache window. Runs on Atlassian
    Statuspage under Utilita's own domain, and offers webhook, RSS, Atom, email and Slack
    subscriptions for push delivery. This is Utilita's only public API; it carries no customer,
    billing or consumption data.
  humanURL: https://status.utilita.co.uk/api
  baseURL: https://status.utilita.co.uk/api/v2
