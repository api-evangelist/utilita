name: Utilita
kind: company
description: >-
  Utilita Energy is a United Kingdom household electricity and gas supplier
  founded in 2003 and headquartered in Eastleigh, Hampshire, specialising in smart
  Pay As You Go (prepayment) energy for roughly 800,000 mostly lower-income homes.
  It sits at the retail end of the GB energy value chain — buying wholesale, holding
  an Ofgem supply licence, and acceding to the Smart Energy Code as a DCC user — and
  it was the first company in Great Britain to install a residential smart electricity
  meter (2005) and a combined smart gas and electricity system (2008). Its ENERGY DATA
  posture is closed on every axis. Britain mandated the smart-meter INFRASTRUCTURE (the
  Smart DCC, the Smart Energy Code, SMETS1/SMETS2 devices) rather than a consumer data
  right, so no CDR- or Green-Button-style obligation compels Utilita to publish a customer
  data API, and it publishes none: no developer portal, no customer usage API, and no open
  market or grid data — developer., developers., api., docs. and data.utilita.co.uk do not
  resolve, and /developers, /api, /docs, /data and /openapi.json all return 404. Customer
  usage and top-up data reaches people only through the My Utilita web portal and mobile
  app behind an account login; third parties reach GB smart-meter data through the DCC
  "Other User" route under the Data Access and Privacy Framework, not through Utilita.
  Utilita does, however, run one genuine public API: the anonymous, CORS-open, documented
  Utilita Status API at status.utilita.co.uk/api/v2, which reports the live health of 21
  tracked components — SMETS1/SMETS2 smart meters, Guest Payments, Open Banking, PayPoint
  and PayZone top-up channels, the My Utilita app and web portal, Power-up, the websites,
  the contact centre, smart meter installations and the smart metering network — along with
  incident and scheduled-maintenance history and self-serve webhook, RSS and Atom
  notifications. Recorded here as an honest closed-supplier baseline for the UK energy
  sector, with an operational-transparency surface that is real and usable.
